[package]
name = "stykanimate-rs"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "StykAnimate ported to Rust (Rune UI): a stick figure animation editor (document model, FK/IK posing, timeline, playback, PNG export)."

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "87caf2a3a2d9e3fb6172f5a62997748dbf25748e" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "87caf2a3a2d9e3fb6172f5a62997748dbf25748e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg"] }
flate2 = "1"
png = "0.17"
swash = "0.2"
zeno = "0.3"

[profile.dev]
opt-level = 1
