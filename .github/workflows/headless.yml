name: Headless Rune probe (snap / tree)

# =====================================================================
# HEADLESS PROBE — Rune Phase E experiment (fail-soft, dispatch-only)
#
# PURPOSE
#   Every Rune binary carries built-in headless tooling
#   (docs/RUNE_API_AUDIT.md, rune tooling/args.rs):
#     --tree out.json   element tree dump ("with animated values")
#     --snap out.png    offscreen render (no window) at --at seconds
#     --scene NAME      apply an AppSpec::scenes fn first
#     --crop KEY        snapshot a single element subtree
#   This workflow runs those modes against the CI-built editor binary
#   on a GPU-less GitHub runner and uploads whatever they produce.
#
# THE UNPROVEN QUESTIONS THIS JOB ANSWERS (data, not pass/fail)
#   Q1. Does `--tree` run with no GPU and no display? The audit says
#       tree mode needs no rendering, but "no rendering" was never the
#       same as "runs on ubuntu-latest" — the binary may still want a
#       display server or a wgpu adapter before it dumps. The job
#       tries plain first, then retries under xvfb, and records which
#       path (if any) produced JSON.
#   Q2. Does `--snap` render under lavapipe (the software Vulkan
#       driver in mesa-vulkan-drivers)? Pixel snapshots need a wgpu
#       adapter; on a GPU-less runner that means software Vulkan.
#       Open since the audit's Q8; docs/QA_RUNE.md §4 rows 4–5 wait
#       on this answer.
#   Q3. Does the `--tree` JSON carry element rects? If yes, the
#       stage-height budget (stage >= 360 px at 1280x720,
#       docs/QA_RUNE.md §3) can be asserted mechanically. If no, the
#       fallback is `--snap --crop stage` and the cropped PNG's own
#       height. A probe step below greps the dump for rect fields.
#       (The audited flag set has no window-size flag, so snaps use
#       the app's default 1440x900 size; the 1280x720 budget check
#       stays approximate until size control is confirmed.)
#   Q4. Does the LIVE MCP endpoint work end to end in the real
#       binary — the running editor answering real HTTP on
#       127.0.0.1:32117, a mutation landing on the live session?
#       The --tree/--snap modes never start the app, so the live
#       control path (Wave 11) gets its own probe: the editor is
#       launched under Xvfb and driven through the full JSON-RPC
#       chain (health, initialize, tools/list, read, mutate,
#       re-read). Its assertions live in the step itself; the
#       transcript is mcp-probe.txt in the artifact.
#
# FAIL-SOFT CONTRACT
#   This workflow can never break the main pipeline: it is a separate
#   file from "Build, Test & Binary" (workflow.yml), it is
#   manual-only (see below), and every snap/tree/probe step is
#   continue-on-error, with artifact uploads set to
#   if-no-files-found: ignore. A failure here means "the probe found
#   something", never "the repo is broken". The build step itself is
#   deliberately NOT fail-soft: if the binary stops building, the
#   main workflow is already red for the same reason and a probe
#   result would be meaningless.
#
# THE BINDING LAYER (Roadmap F-7, A26 R1 — read before touching
# either half)
#   Fail-soft steps + strict transcripts had a failure mode of
#   their own, paid for on record: green conclusions hiding red
#   transcripts, and an overflow scan that was never run over an
#   artifact reported CLEAN. So the probe steps stay soft (data
#   collection), but they are now FOLLOWED by strict readers:
#     * an overflow-scan step runs scripts/overflow_scan.py over
#       the dumps THIS run just produced (same job, same files);
#     * an aggregate step folds every transcript into ONE
#       machine-readable verdict (headless-out/verdict.json,
#       scripts/verdict_aggregate.py);
#     * a separate `verdict` JOB at the bottom of this file
#       downloads the artifact and re-runs the aggregator with
#       NO fail-soft wrapper — its conclusion IS the verdict,
#       and it is the check to mark required in branch
#       protection. Do not soften the verdict job, and do not
#       harden the probe steps: each half is the other's reason.
#
# WHY workflow_dispatch ONLY (no push trigger)
#   A push trigger would pay for a second full release build on every
#   push — roughly doubling CI minutes — to re-answer questions that
#   only need answering when the shell layout or the Rune pin
#   changes. Run it by hand: Actions tab -> this workflow -> Run
#   workflow. To promote it later, once it has proven stable, add
#   alongside workflow_dispatch below:
#       push:
#         branches: [master]
#         paths: ["src/**"]
#
# HOW TO READ THE RESULTS
#   * The run's Summary tab lists, per output, PRESENT or MISSING
#     plus byte sizes; the rect probe's findings are appended there.
#   * The `headless-probe-output` artifact holds the raw files:
#     tree-<scene>.json (+ .log / .exit per invocation, and -xvfb
#     variants when the fallback ran), snap-default.png,
#     snap-stage.png (the `--crop stage` variant), vulkaninfo.txt,
#     rect-probe.txt.
#   * Tree JSON present from the PLAIN attempt -> Q1: yes, tree mode
#     needs neither GPU nor display on the runner. Present only from
#     the XVFB attempt -> tree mode needs a display but not a GPU.
#     Missing entirely -> read the step logs and .exit files; that
#     is the answer too, just a disappointing one.
#   * snap-default.png present -> Q2: yes, lavapipe renders Rune;
#     the QA_RUNE §3 fallback (a) and CI screenshot checks unlock.
#   * rect-probe.txt says whether the tree dump carries rects (Q3).
#   * mcp-probe.txt is the live endpoint's assertion transcript
#     (Q4): every line PASS, ending "MCP PROBE: PASS", means the
#     chain held; any FAIL line names the broken link, and the
#     step itself is marked failed with the app's log tail in the
#     step log (mcp-live-app.log is in the artifact too).
# =====================================================================

on:
  workflow_dispatch:

# Manual runs of the probe should not pile up on each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Roadmap Wave 1 (RM9, IA-RM9-3): since the AppDirs
  # move, the editor's store lives in the OS config dir
  # unless STYKANIMATE_PORTABLE is set — the probes seed
  # and reset the checkout's ./projects store, so the
  # probe runs portable, as it did before the move.
  STYKANIMATE_PORTABLE: "1"
  CARGO_TERM_COLOR: always
  # Same as the main workflow: incremental artifacts bloat the cache.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  headless-probe:
    name: Headless --tree / --snap probe (software Vulkan)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The build-dep list mirrors workflow.yml (the binary links the
      # same libraries); the probe adds mesa-vulkan-drivers (lavapipe,
      # the software Vulkan adapter Q2 is about), vulkan-tools
      # (vulkaninfo, to prove lavapipe is actually visible) and xvfb
      # (the virtual display for the Q1 fallback attempt).
      - name: Install system libraries (build deps + software Vulkan + xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            libasound2-dev \
            libudev-dev \
            cmake \
            clang \
            ffmpeg \
            mesa-vulkan-drivers \
            vulkan-tools \
            xvfb

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # Same cache as the main workflow, so a warm target dir is
      # reused instead of recompiling the world for a probe.
      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-release
          cache-on-failure: true

      - name: Build (release, all binaries)
        run: cargo build --release --locked --bins

      # Evidence for Q2 before any snap is attempted: if lavapipe is
      # not even visible to vulkaninfo, a missing PNG is explained
      # before it happens.
      - name: Record the Vulkan stack (is lavapipe visible?)
        continue-on-error: true
        run: |
          mkdir -p headless-out
          vulkaninfo --summary 2>&1 | tee headless-out/vulkaninfo.txt || true

      # Q1, attempt 1: no display, no GPU — the audit's claim, tested
      # exactly. One dump per scene from docs/QA_RUNE.md §3. `set +e`
      # so a failing invocation is recorded, not fatal; the step
      # still reports failure if any scene produced no JSON, which is
      # what arms the xvfb fallback below.
      - name: Tree dumps — plain (no display)
        id: tree_plain
        continue-on-error: true
        timeout-minutes: 6
        run: |
          set +e
          BIN=./target/release/stykanimate-rs
          # Every probe process starts from a CLEAN slate
          # (Phase N close-out): the app persists layout
          # prefs — including the workspace — to
          # ./projects/.layout.json relative to the CWD
          # (shell::load_layout), and a scene process that
          # selects a workspace otherwise leaks it into
          # the next probe whose scene does not set one.
          # The first Phase N headless run rendered
          # snap-default in the Draw workspace because the
          # draw-open tree probe ran last and left Draw
          # prefs behind; a fresh HOME alone did NOT fix
          # it (run 42488210880) — the prefs file is
          # CWD-relative, so probe() also wipes ./projects
          # before every invocation.
          probe() { rm -rf ./projects; HOME="$(mktemp -d)" timeout "$@"; }
          mkdir -p headless-out
          missing=0
          for scene in default frame-3 selected playing graph-duplicates fx-split-mid three-d loop-range three-d-stage palette-open menu-open settings-open draw-open default-light settings-open-light export-open fx-selected home build-open graph-open effects-open audio-open clips-populated dopesheet-keys home-populated strokes-populated library-populated sprites-populated settings-open-error subtitles-populated subtitles-top subtitles-speaker home-missing-audio home-scan-fallback states-populated build-workspace focus-field long-project dialogue-lane subtitles-assist marquee-selected sprites-flipped; do
            # H2: home-populated alone needs a pre-scroll. H1's M4
            # (template/sample blurbs, +128 pt) pushed home-totals
            # and row-2 below the 900 pt window, so the thumbnail
            # probe's control strip is off-snap at scroll 0. The
            # script wheels side-left down 200 pt (instant, 1:1,
            # dy negative moves content up); the tree dump reports
            # drawn rects, so the probe's strips stay aligned with
            # the snap. The scene list itself is untouched (gate
            # check 8: this loop is the coverage contract).
            if [ "$scene" = "home-populated" ]; then
              probe 60 "$BIN" --tree "headless-out/tree-$scene.json" --scene "$scene" --script scripts/headless-scroll-home.json --at 0.5 \
                > "headless-out/tree-$scene.log" 2>&1
            else
              probe 60 "$BIN" --tree "headless-out/tree-$scene.json" --scene "$scene" \
                > "headless-out/tree-$scene.log" 2>&1
            fi
            echo $? > "headless-out/tree-$scene.exit"
            [ -f "headless-out/tree-$scene.json" ] || missing=1
          done
          # Wave 7 size variants: window size is a CLI axis,
          # not a scene property, so the 1280x720 pairings are
          # explicit probes (default dark, default light, and
          # three-d — the deepest reachable status-strip state
          # at that width).
          probe 60 "$BIN" --tree "headless-out/tree-default-1280.json" --scene default --size 1280x720 \
            > "headless-out/tree-default-1280.log" 2>&1
          echo $? > "headless-out/tree-default-1280.exit"
          [ -f "headless-out/tree-default-1280.json" ] || missing=1
          probe 60 "$BIN" --tree "headless-out/tree-default-light-1280.json" --scene default-light --size 1280x720 \
            > "headless-out/tree-default-light-1280.log" 2>&1
          echo $? > "headless-out/tree-default-light-1280.exit"
          [ -f "headless-out/tree-default-light-1280.json" ] || missing=1
          probe 60 "$BIN" --tree "headless-out/tree-three-d-1280.json" --scene three-d --size 1280x720 \
            > "headless-out/tree-three-d-1280.log" 2>&1
          echo $? > "headless-out/tree-three-d-1280.exit"
          [ -f "headless-out/tree-three-d-1280.json" ] || missing=1
          exit $missing

      # Q1, attempt 2: only the scenes attempt 1 missed, under a
      # virtual display. The outcome split plain-vs-xvfb is itself
      # the Q1 answer (display needed? yes/no).
      - name: Tree dumps — xvfb fallback (only scenes the plain attempt missed)
        if: ${{ !cancelled() && steps.tree_plain.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 6
        run: |
          set +e
          BIN=./target/release/stykanimate-rs
          # Every probe process starts from a CLEAN slate
          # (Phase N close-out): the app persists layout
          # prefs — including the workspace — to
          # ./projects/.layout.json relative to the CWD
          # (shell::load_layout), and a scene process that
          # selects a workspace otherwise leaks it into
          # the next probe whose scene does not set one.
          # The first Phase N headless run rendered
          # snap-default in the Draw workspace because the
          # draw-open tree probe ran last and left Draw
          # prefs behind; a fresh HOME alone did NOT fix
          # it (run 42488210880) — the prefs file is
          # CWD-relative, so probe() also wipes ./projects
          # before every invocation.
          probe() { rm -rf ./projects; HOME="$(mktemp -d)" timeout "$@"; }
          # The retry list mirrors the plain attempt's
          # list exactly (Wave V, V14): the Wave 7 light
          # pair (default-light, settings-open-light) was
          # missing here, so a plain-attempt miss on either
          # could never be recovered and its dump would be
          # absent without a word. The plain loop remains
          # the coverage contract (gate check 8); this list
          # is its recovery set, not a subset by design.
          for scene in default frame-3 selected playing graph-duplicates fx-split-mid three-d loop-range three-d-stage palette-open menu-open settings-open draw-open default-light settings-open-light export-open fx-selected home build-open graph-open effects-open audio-open clips-populated dopesheet-keys home-populated strokes-populated library-populated sprites-populated settings-open-error subtitles-populated subtitles-top subtitles-speaker home-missing-audio home-scan-fallback states-populated build-workspace focus-field long-project dialogue-lane subtitles-assist marquee-selected sprites-flipped; do
            if [ ! -f "headless-out/tree-$scene.json" ]; then
              # H2: same pre-scroll as the plain attempt (see above).
              if [ "$scene" = "home-populated" ]; then
                probe 60 xvfb-run -a "$BIN" --tree "headless-out/tree-$scene.json" --scene "$scene" --script scripts/headless-scroll-home.json --at 0.5 \
                  > "headless-out/tree-$scene-xvfb.log" 2>&1
              else
                probe 60 xvfb-run -a "$BIN" --tree "headless-out/tree-$scene.json" --scene "$scene" \
                  > "headless-out/tree-$scene-xvfb.log" 2>&1
              fi
              echo $? > "headless-out/tree-$scene-xvfb.exit"
            fi
          done

      # Q2: offscreen render under lavapipe. Full window first, then
      # the stage crop (QA_RUNE §3 fallback a — the cropped PNG's
      # height is the stage-height measurement if Q3 answers no).
      # Plain attempt first; one xvfb retry if no PNG appeared, so a
      # display dependency in snap mode is also surfaced as data.
      - name: Snap renders — lavapipe attempt
        continue-on-error: true
        timeout-minutes: 8
        env:
          WGPU_BACKEND: vulkan
        run: |
          set +e
          BIN=./target/release/stykanimate-rs
          # Every probe process starts from a CLEAN slate
          # (Phase N close-out): the app persists layout
          # prefs — including the workspace — to
          # ./projects/.layout.json relative to the CWD
          # (shell::load_layout), and a scene process that
          # selects a workspace otherwise leaks it into
          # the next probe whose scene does not set one.
          # The first Phase N headless run rendered
          # snap-default in the Draw workspace because the
          # draw-open tree probe ran last and left Draw
          # prefs behind; a fresh HOME alone did NOT fix
          # it (run 42488210880) — the prefs file is
          # CWD-relative, so probe() also wipes ./projects
          # before every invocation.
          probe() { rm -rf ./projects; HOME="$(mktemp -d)" timeout "$@"; }
          mkdir -p headless-out
          probe 120 "$BIN" --snap headless-out/snap-default.png --scene default --at 0 \
            > headless-out/snap-default.log 2>&1
          echo $? > headless-out/snap-default.exit
          probe 120 "$BIN" --snap headless-out/snap-stage.png --scene default --at 0 --crop stage \
            > headless-out/snap-stage.log 2>&1
          echo $? > headless-out/snap-stage.exit
          probe 120 "$BIN" --snap headless-out/snap-three-d.png --scene three-d --at 0 \
            > headless-out/snap-three-d.log 2>&1
          echo $? > headless-out/snap-three-d.exit
          probe 120 "$BIN" --snap headless-out/snap-three-d-stage.png --scene three-d-stage --at 0 \
            > headless-out/snap-three-d-stage.log 2>&1
          echo $? > headless-out/snap-three-d-stage.exit
          # Phase N (P17 section 4): the restyled surfaces only
          # pixels can prove — the palette card, the File menu
          # dropdown, the settings card and the Draw workspace.
          probe 120 "$BIN" --snap headless-out/snap-palette-open.png --scene palette-open --at 0 \
            > headless-out/snap-palette-open.log 2>&1
          echo $? > headless-out/snap-palette-open.exit
          probe 120 "$BIN" --snap headless-out/snap-menu-open.png --scene menu-open --at 0 \
            > headless-out/snap-menu-open.log 2>&1
          echo $? > headless-out/snap-menu-open.exit
          # Roadmap Wave 2 (W2-77, IA-W2-77-5, optional): the
          # flip's pixel proof — sprite 0 mirrored, sprite 1
          # the control.
          probe 120 "$BIN" --snap headless-out/snap-sprites-flipped.png --scene sprites-flipped --at 0 \
            > headless-out/snap-sprites-flipped.log 2>&1
          echo $? > headless-out/snap-sprites-flipped.exit
          # Roadmap Wave 2 (W2-66, IA-W2-66-3): the scripted
          # Tab walk and type probe over the pre-focused
          # focus-field scene (fail-soft like the other
          # probes; the focus census below reads them).
          probe 60 "$BIN" --scene focus-field --script scripts/focus_tab_walk.json \
            --tree headless-out/tree-focus-field-tab4.json --at 1 \
            > headless-out/tree-focus-field-tab4.log 2>&1
          echo $? > headless-out/tree-focus-field-tab4.exit
          probe 60 "$BIN" --scene focus-field --script scripts/focus_type_probe.json \
            --tree headless-out/tree-focus-field-type.json --at 1 \
            > headless-out/tree-focus-field-type.log 2>&1
          echo $? > headless-out/tree-focus-field-type.exit
          probe 120 "$BIN" --snap headless-out/snap-settings-open.png --scene settings-open --at 0 \
            > headless-out/snap-settings-open.log 2>&1
          echo $? > headless-out/snap-settings-open.exit
          probe 120 "$BIN" --snap headless-out/snap-draw-open.png --scene draw-open --at 0 \
            > headless-out/snap-draw-open.log 2>&1
          echo $? > headless-out/snap-draw-open.exit
          # Wave 9: one snap per workspace scene the wave
          # added (Home / Build3D / Graph / Effects / Audio),
          # the Export workspace (its panel had never been
          # tree-dumped or snapped — the overflow scanner's
          # blind spot), and the clips-populated Animate
          # state (the first tree/snap containing clip rows).
          probe 120 "$BIN" --snap headless-out/snap-home.png --scene home --at 0 \
            > headless-out/snap-home.log 2>&1
          echo $? > headless-out/snap-home.exit
          probe 120 "$BIN" --snap headless-out/snap-build-open.png --scene build-open --at 0 \
            > headless-out/snap-build-open.log 2>&1
          echo $? > headless-out/snap-build-open.exit
          probe 120 "$BIN" --snap headless-out/snap-graph-open.png --scene graph-open --at 0 \
            > headless-out/snap-graph-open.log 2>&1
          echo $? > headless-out/snap-graph-open.exit
          probe 120 "$BIN" --snap headless-out/snap-effects-open.png --scene effects-open --at 0 \
            > headless-out/snap-effects-open.log 2>&1
          echo $? > headless-out/snap-effects-open.exit
          probe 120 "$BIN" --snap headless-out/snap-audio-open.png --scene audio-open --at 0 \
            > headless-out/snap-audio-open.log 2>&1
          echo $? > headless-out/snap-audio-open.exit
          probe 120 "$BIN" --snap headless-out/snap-export-open.png --scene export-open --at 0 \
            > headless-out/snap-export-open.log 2>&1
          echo $? > headless-out/snap-export-open.exit
          probe 120 "$BIN" --snap headless-out/snap-clips-populated.png --scene clips-populated --at 0 \
            > headless-out/snap-clips-populated.log 2>&1
          echo $? > headless-out/snap-clips-populated.exit
          # Wave 10: the dopesheet lane in a populated
          # state (two keyed figures, playhead mid-row) —
          # the first tree/snap containing dope rows and
          # cells, and the pixel evidence for the lane's
          # frame-column alignment against the chips.
          probe 120 "$BIN" --snap headless-out/snap-dopesheet-keys.png --scene dopesheet-keys --at 0 \
            > headless-out/snap-dopesheet-keys.log 2>&1
          echo $? > headless-out/snap-dopesheet-keys.exit
          # Wave 12: the two populated states Wave 11
          # named as never pixel-proven — Home carrying
          # real project rows and thumbnails (the home
          # scene above was only ever snapped empty) and
          # the Animate stage carrying strokes, so the
          # stroke inspector rows exist in a tree and a
          # snap for the first time.
          # H2: same pre-scroll as the tree dump (see the tree
          # loop) — the probe pairs this snap with that tree, so
          # both must be scrolled identically; --at 0.5 captures
          # after the t=0 wheel has landed.
          probe 120 "$BIN" --snap headless-out/snap-home-populated.png --scene home-populated --script scripts/headless-scroll-home.json --at 0.5 \
            > headless-out/snap-home-populated.log 2>&1
          echo $? > headless-out/snap-home-populated.exit
          # Wave V (V7): the missing-audio Home state,
          # snapped as well — until now the scene was
          # only ever tree-dumped (its marker proof is
          # tree text), so its single row's thumbnail had
          # no pixels to prove. The thumbnail probe step
          # below reads this snap against
          # snap-home-populated.png (the probe's pair
          # gate: the seeded project is the demo project,
          # so its thumbnail must match the demo row's
          # thumbnail in the populated snap and differ
          # from the added-figure rows).
          probe 120 "$BIN" --snap headless-out/snap-home-missing-audio.png --scene home-missing-audio --at 0 \
            > headless-out/snap-home-missing-audio.log 2>&1
          echo $? > headless-out/snap-home-missing-audio.exit
          probe 120 "$BIN" --snap headless-out/snap-strokes-populated.png --scene strokes-populated --at 0 \
            > headless-out/snap-strokes-populated.log 2>&1
          echo $? > headless-out/snap-strokes-populated.exit
          # Wave 13: the two populated states Wave 12's
          # close-out named as unproven — the figure
          # library carrying real entries, so the library
          # rows' Wave 12 thumbnails render in a snap for
          # the first time, and the stage carrying sprite
          # instances with the Sprites panel mounted (this
          # wave's headline surface, whose placeholder
          # outlines only pixels can prove).
          probe 120 "$BIN" --snap headless-out/snap-library-populated.png --scene library-populated --at 0 \
            > headless-out/snap-library-populated.log 2>&1
          echo $? > headless-out/snap-library-populated.exit
          probe 120 "$BIN" --snap headless-out/snap-sprites-populated.png --scene sprites-populated --at 0 \
            > headless-out/snap-sprites-populated.log 2>&1
          echo $? > headless-out/snap-sprites-populated.exit
          # Wave 14 (E8): the settings card on a genuine
          # Live MCP start failure — the snap shows the D1
          # failure note (with the recorded OS error) under
          # the Live MCP toggle; the note has no element
          # key, so pixels are its proof.
          probe 120 "$BIN" --snap headless-out/snap-settings-open-error.png --scene settings-open-error --at 0 \
            > headless-out/snap-settings-open-error.log 2>&1
          echo $? > headless-out/snap-settings-open-error.exit
          # Wave P (P33): the subtitle stage draw's pixel
          # proof inputs — the seeded cue under both
          # anchors. Full window (the census locates the
          # stage rect in tree-subtitles-populated.json)
          # plus the stage crops the scene docs name as
          # the census's band inputs.
          probe 120 "$BIN" --snap headless-out/snap-subtitles-populated.png --scene subtitles-populated --at 0 \
            > headless-out/snap-subtitles-populated.log 2>&1
          echo $? > headless-out/snap-subtitles-populated.exit
          probe 120 "$BIN" --snap headless-out/snap-subtitles-populated-crop.png --scene subtitles-populated --at 0 --crop stage \
            > headless-out/snap-subtitles-populated-crop.log 2>&1
          echo $? > headless-out/snap-subtitles-populated-crop.exit
          probe 120 "$BIN" --snap headless-out/snap-subtitles-top.png --scene subtitles-top --at 0 \
            > headless-out/snap-subtitles-top.log 2>&1
          echo $? > headless-out/snap-subtitles-top.exit
          probe 120 "$BIN" --snap headless-out/snap-subtitles-top-crop.png --scene subtitles-top --at 0 --crop stage \
            > headless-out/snap-subtitles-top-crop.log 2>&1
          echo $? > headless-out/snap-subtitles-top-crop.exit
          probe 120 "$BIN" --snap headless-out/snap-subtitles-speaker.png --scene subtitles-speaker --at 0 \
            > headless-out/snap-subtitles-speaker.log 2>&1
          echo $? > headless-out/snap-subtitles-speaker.exit
          probe 120 "$BIN" --snap headless-out/snap-subtitles-speaker-crop.png --scene subtitles-speaker --at 0 --crop stage \
            > headless-out/snap-subtitles-speaker-crop.log 2>&1
          echo $? > headless-out/snap-subtitles-speaker-crop.exit
          # Two Effects-workspace snaps, because the scene
          # names are historical: the scene NAMED fx-selected
          # selects a particle event (State::particle_selected)
          # and shows the FX browser + Particles detail card
          # (P17 section 4's checklist); fx-split-mid is the
          # only scene that selects an FX clip
          # (State::fx_selected, playhead parked inside the
          # clip), proving the FX inspector's selected state.
          probe 120 "$BIN" --snap headless-out/snap-fx-selected.png --scene fx-selected --at 0 \
            > headless-out/snap-fx-selected.log 2>&1
          echo $? > headless-out/snap-fx-selected.exit
          probe 120 "$BIN" --snap headless-out/snap-fx-split-mid.png --scene fx-split-mid --at 0 \
            > headless-out/snap-fx-split-mid.log 2>&1
          echo $? > headless-out/snap-fx-split-mid.exit
          # Wave 7: light-theme snaps and the 1280x720 pair.
          probe 120 "$BIN" --snap headless-out/snap-default-light.png --scene default-light --at 0 \
            > headless-out/snap-default-light.log 2>&1
          echo $? > headless-out/snap-default-light.exit
          probe 120 "$BIN" --snap headless-out/snap-settings-open-light.png --scene settings-open-light --at 0 \
            > headless-out/snap-settings-open-light.log 2>&1
          echo $? > headless-out/snap-settings-open-light.exit
          probe 120 "$BIN" --snap headless-out/snap-default-1280.png --scene default --at 0 --size 1280x720 \
            > headless-out/snap-default-1280.log 2>&1
          echo $? > headless-out/snap-default-1280.exit
          probe 120 "$BIN" --snap headless-out/snap-default-light-1280.png --scene default-light --at 0 --size 1280x720 \
            > headless-out/snap-default-light-1280.log 2>&1
          echo $? > headless-out/snap-default-light-1280.exit
          if [ ! -f headless-out/snap-default.png ]; then
            probe 120 xvfb-run -a "$BIN" --snap headless-out/snap-default.png --scene default --at 0 \
              > headless-out/snap-default-xvfb.log 2>&1
            echo $? > headless-out/snap-default-xvfb.exit
          fi

      # Q3: scan whatever tree dumps exist for rect-like fields and
      # for the shape of the `stage` node. Pure stdlib python; every
      # failure mode (no files, unreadable JSON) is reported in the
      # probe text instead of failing.
      - name: Probe tree JSON for element rects
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python3 - <<'PYEOF' || true
          import glob, json, os
          out = []
          files = sorted(glob.glob("headless-out/tree-*.json"))
          if not files:
              out.append("No tree dumps present - rect question unanswered (tree mode produced nothing).")
          RECT_KEYS = {"rect", "bounds", "frame", "size", "width", "height", "w", "h", "x", "y"}
          for path in files:
              try:
                  data = json.load(open(path))
              except Exception as e:
                  out.append(f"{path}: unreadable JSON ({e})")
                  continue
              keys = set()
              stage_nodes = []
              def walk(node):
                  if isinstance(node, dict):
                      keys.update(str(k) for k in node.keys())
                      if node.get("key") == "stage" or node.get("name") == "stage":
                          stage_nodes.append(node)
                      for v in node.values():
                          walk(v)
                  elif isinstance(node, list):
                      for v in node:
                          walk(v)
              walk(data)
              hits = sorted(k for k in keys if k.lower() in RECT_KEYS)
              out.append(f"{path}: rect-like keys: {hits if hits else 'NONE'}")
              if stage_nodes:
                  s = stage_nodes[0]
                  out.append(f"{path}: 'stage' node fields: {sorted(str(k) for k in s.keys())}")
                  out.append(f"{path}: 'stage' node (truncated): {json.dumps(s)[:400]}")
              else:
                  out.append(f"{path}: no node with key/name == 'stage' found")
          text = "\n".join(out) + "\n"
          os.makedirs("headless-out", exist_ok=True)
          open("headless-out/rect-probe.txt", "w").write(text)
          print(text)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as fh:
                  fh.write("\n### Tree rect probe (Q3)\n\n```\n" + text + "```\n")
          PYEOF

      # Wave P (P33): the subtitle census — the seeded cue
      # pixel-proven on the stage over the snaps above
      # (scripts/subtitle_census.py). Fail-soft like every
      # probe step, strict internal verdict: the transcript
      # (subtitle-census.txt) rides the artifact upload, and
      # a FAIL line names the broken assertion.
      - name: Subtitle census — seeded cue pixel-proven on the stage
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set +e
          python3 scripts/subtitle_census.py headless-out
          rc=$?
          echo $rc > headless-out/subtitle-census.exit
          exit $rc

      # Wave Q (Q16): the Home thumbnail pixel proof. The
      # snap step above only uploads snap-home-populated.png;
      # this probe reads it back against the same run's tree
      # dump and asserts the three populated rows carry
      # rendered frame-0 thumbnails (see
      # scripts/home_thumbnail_probe.py). Fail-soft like
      # every probe step: the transcript is the result.
      # Wave V (V7): the --also pair extends the same
      # transcript with the missing-audio snap — its row's
      # non-blank floors plus the cross-scene fidelity
      # gate (identical projects share a thumbnail
      # pixel-for-pixel; the added-figure projects
      # differ). A missing missing-audio snap reports
      # UNPROVEN in the transcript, never a step failure.
      - name: Home thumbnail probe — do the populated rows carry renders?
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python3 scripts/home_thumbnail_probe.py \
            headless-out/snap-home-populated.png \
            headless-out/tree-home-populated.json \
            headless-out/home-thumbnail-probe.txt \
            --also-snap headless-out/snap-home-missing-audio.png \
            --also-tree headless-out/tree-home-missing-audio.json || true

      # Wave T (T12): the Home missing-audio marker — the
      # tree-text proof the geometry scanner cannot make.
      # The marker is the `text` of the element keyed
      # home-proj-meta-0 in tree-home-missing-audio.json;
      # the transcript records PASS/FAIL per the probe's
      # fail-soft contract.
      - name: Home missing-audio marker — tree text grep
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set +e
          python3 - <<'PYEOF'
          import json
          tree = json.load(open("headless-out/tree-home-missing-audio.json"))
          rows = [e for e in tree["elements"] if e.get("key") == "home-proj-meta-0"]
          ok = len(rows) == 1 and rows[0].get("text", "").endswith("· 1 audio clip missing")
          verdict = "HOME MISSING-AUDIO MARKER: " + ("PASS" if ok else "FAIL")
          print(verdict)
          open("headless-out/home-missing-audio-marker.txt", "w").write(verdict + "\n")
          PYEOF

      # Wave U (U12): the Home scan-fallback marker — the
      # tree-text proof for the fallback arm the geometry
      # scanner cannot make. The marker is the `text` of
      # the element keyed home-proj-meta-0 in
      # tree-home-scan-fallback.json; the seeded file is
      # hand-trimmed of its frames key, so the row's light
      # read refuses it and the text is the scan's line —
      # it must ALSO carry the scan's defaulted frame
      # count ("0 frames"), the fallback discriminator
      # against the light-read line proven by the
      # home-missing-audio step above. The transcript
      # records PASS/FAIL per the probe's fail-soft
      # contract.
      - name: Home scan-fallback marker — tree text grep
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set +e
          python3 - <<'PYEOF'
          import json
          tree = json.load(open("headless-out/tree-home-scan-fallback.json"))
          rows = [e for e in tree["elements"] if e.get("key") == "home-proj-meta-0"]
          text = rows[0].get("text", "") if len(rows) == 1 else ""
          ok = text.endswith("· 1 audio clip missing") and "· 0 frames ·" in text
          verdict = "HOME SCAN-FALLBACK MARKER: " + ("PASS" if ok else "FAIL")
          print(verdict)
          open("headless-out/home-scan-fallback-marker.txt", "w").write(verdict + "\n")
          PYEOF

      # Q4 (Wave 11): the LIVE control path. Every step
      # above probes the binary's one-shot modes (--tree /
      # --snap); nothing has ever run the actual editor and
      # spoken to its live MCP endpoint (127.0.0.1:32117,
      # src/live_mcp.rs) the way a real MCP client does.
      # This step does: launch the editor under Xvfb, wait
      # for GET /health, then run the full JSON-RPC chain
      # over real HTTP — initialize, the initialized
      # notification, tools/list, a read (get_state), a
      # mutation (add_frame), the same read again proving
      # the mutation landed, and get_editor_status proving
      # it landed on the LIVE session (undo history +
      # playhead), not on a side core. The exercise is one
      # stdlib-python script (same idiom as the rect probe
      # above; no jq or new dependencies). Fail-soft like
      # every probe step (continue-on-error, so the upload
      # and summary still run), but the step's own verdict
      # is strict: any failed assertion exits 1 and the
      # app's log tail is printed — a probe that passes
      # vacuously would be worse than none. Outputs:
      # mcp-probe.txt (the assertion transcript),
      # mcp-live-app.log (the app's own output),
      # mcp-xvfb.log, mcp-probe.exit — all ride the
      # artifact upload below untouched.
      - name: Live MCP probe — drive the running editor over HTTP
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          WGPU_BACKEND: vulkan
        run: |
          set +e
          BIN=./target/release/stykanimate-rs
          mkdir -p headless-out
          # Clean slate, the same discipline as probe()
          # above: layout prefs live at
          # ./projects/.layout.json relative to the CWD,
          # and main.rs init starts the bridge when the
          # stored live-MCP pref says so (shell.rs
          # LayoutPrefs::live_mcp) — wiping ./projects
          # (plus a fresh HOME, like the other probes) is
          # what makes the slate a property of the binary,
          # not of whatever state an earlier probe left
          # behind.
          rm -rf ./projects
          export HOME="$(mktemp -d)"
          # Wave X: since Wave W (W4) the live-MCP pref
          # defaults OFF (explicit-enable), so a clean slate
          # alone no longer starts the bridge and this probe
          # failed on its stale default-on premise inside
          # two green conclusions. The probe exists to
          # exercise the ENABLED path, so seed the stored
          # pref — the deliberate opt-in a user makes in
          # Settings — into the fresh projects dir before
          # launching; the loader's field salvage adopts
          # the one correctly-typed field.
          mkdir -p ./projects
          printf '{ "live_mcp": true }\n' > ./projects/.layout.json
          # A windowed run needs a display (the one-shot
          # modes above do not): Xvfb by hand rather than
          # xvfb-run, because the app is a long-lived
          # server here and the step needs its exact PID
          # to kill it cleanly afterwards.
          Xvfb :99 -screen 0 1440x900x24 > headless-out/mcp-xvfb.log 2>&1 &
          XVFB_PID=$!
          for i in $(seq 1 25); do
            [ -S /tmp/.X11-unix/X99 ] && break
            sleep 0.2
          done
          export DISPLAY=:99
          "$BIN" > headless-out/mcp-live-app.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null
            wait "$APP_PID" 2>/dev/null
            kill "$XVFB_PID" 2>/dev/null
          }
          trap cleanup EXIT
          # Roadmap F-10 (RM11): the tools/list floor DERIVES
          # from the gate's MCP_SURFACE_FLOOR constant in
          # scripts/phase_j_checks.py, read by
          # scripts/mcp_tool_floor.py — the single ledgered
          # source. It replaces the stale hard-coded 370 that
          # stood here while the surface grew to 392: a copied
          # floor silently stops binding the day it is copied.
          # The derivation fails the step loudly (set +e is in
          # force, so check explicitly) rather than probing
          # against a guessed number.
          MCP_TOOL_FLOOR="$(python3 scripts/mcp_tool_floor.py)" || { echo "TOOL FLOOR DERIVATION FAILED — see scripts/mcp_tool_floor.py"; exit 1; }
          export MCP_TOOL_FLOOR
          echo "Live MCP probe: tool floor $MCP_TOOL_FLOOR (derived from MCP_SURFACE_FLOOR in scripts/phase_j_checks.py)"
          python3 - <<'PYEOF'
          import json, os, sys, time, urllib.error, urllib.request

          BASE = "http://127.0.0.1:32117"
          # The tools/list floor arrives via MCP_TOOL_FLOOR,
          # derived by the step above from the gate's
          # MCP_SURFACE_FLOOR constant (scripts/mcp_tool_floor.py;
          # Roadmap F-10). tools/list returns all_tools()
          # unfiltered (tools_list_result in mcp.rs), so the
          # floor is a minimum, not an equality: later waves ADD
          # tools, and the gate's ratchet ledger is where the
          # floor moves. The binding invariant is the cross-check
          # below — the health document's count and the
          # tools/list length are read from the same registry
          # by two different code paths (listener thread vs UI
          # thread dispatch) and must agree. A missing env var is
          # a loud failure, never a silent default.
          TOOL_FLOOR = int(os.environ["MCP_TOOL_FLOOR"])

          lines = []
          failures = []

          def note(text):
              lines.append(text)
              print(text, flush=True)

          def check(ok, label, detail=""):
              note(("PASS  " if ok else "FAIL  ") + label + ("" if ok else f"  [{detail}]"))
              if not ok:
                  failures.append(label)

          def get(path, timeout=10):
              req = urllib.request.Request(BASE + path, method="GET")
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  return resp.status, resp.read().decode("utf-8", "replace")

          def post(msg, timeout=30):
              body = json.dumps(msg).encode()
              req = urllib.request.Request(
                  BASE + "/mcp", data=body, method="POST",
                  headers={"Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as resp:
                      return resp.status, resp.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")

          def rpc(id_, method, params=None):
              msg = {"jsonrpc": "2.0", "id": id_, "method": method}
              if params is not None:
                  msg["params"] = params
              status, raw = post(msg)
              if status != 200:
                  raise RuntimeError(f"{method}: HTTP {status}: {raw[:200]}")
              resp = json.loads(raw)
              if resp.get("id") != id_:
                  raise RuntimeError(f"{method}: response id {resp.get('id')!r} != {id_!r}")
              if "error" in resp:
                  raise RuntimeError(f"{method}: JSON-RPC error {resp['error']}")
              return resp["result"]

          def call_tool(id_, name, args=None):
              result = rpc(id_, "tools/call", {"name": name, "arguments": args or {}})
              text = (result.get("content") or [{}])[0].get("text", "")
              try:
                  payload = json.loads(text)
              except ValueError:
                  payload = None
              return result.get("isError", True), payload, text

          def finish():
              verdict = "MCP PROBE: PASS" if not failures else f"MCP PROBE: FAIL ({len(failures)} assertion(s) failed)"
              note(verdict)
              text = "\n".join(lines) + "\n"
              os.makedirs("headless-out", exist_ok=True)
              with open("headless-out/mcp-probe.txt", "w") as fh:
                  fh.write(text)
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a") as fh:
                      fh.write("\n### Live MCP probe (Q4)\n\n```\n" + text + "```\n")
              sys.exit(0 if not failures else 1)

          def main():
              # 0. Wait for the endpoint: poll GET /health for up
              #    to ~90 s. The bridge binds during app init
              #    (main.rs, before the first frame), so a healthy
              #    app answers quickly; the budget covers a slow
              #    runner. Silence is retried, never accepted.
              health = None
              deadline = time.time() + 90
              while time.time() < deadline:
                  try:
                      status, raw = get("/health", timeout=5)
                      if status == 200:
                          health = json.loads(raw)
                          break
                  except Exception:
                      pass
                  time.sleep(2)
              check(health is not None, "GET /health answers 200 within 90 s")
              if health is None:
                  return
              check(health.get("live") is True, "health names a LIVE endpoint", str(health)[:200])
              check(health.get("server") == "stykanimate-rs", "health server identity", repr(health.get("server")))
              check(health.get("auth") == "none", "health states the v1 auth posture (none)", repr(health.get("auth")))
              health_tools = health.get("tools")
              check(isinstance(health_tools, int) and health_tools >= TOOL_FLOOR,
                    f"health tool count >= floor {TOOL_FLOOR}", f"tools={health_tools!r}")

              # 1. initialize: the handshake names the server.
              result = rpc(1, "initialize", {
                  "protocolVersion": "2024-11-05",
                  "capabilities": {},
                  "clientInfo": {"name": "headless-mcp-probe", "version": "0"},
              })
              name = (result.get("serverInfo") or {}).get("name")
              check(name == "stykanimate-rs", "initialize serverInfo.name", repr(name))

              # 2. The initialized notification: no id, so the
              #    listener's fast path answers 202 with an empty
              #    body and executes nothing.
              status, raw = post({"jsonrpc": "2.0", "method": "notifications/initialized"})
              check(status == 202 and raw == "", "notification -> HTTP 202, empty body", f"{status} {raw[:80]!r}")

              # 3. tools/list: the whole registry, and the same
              #    count the health document reported.
              result = rpc(2, "tools/list")
              tools = result.get("tools") or []
              names = {t.get("name") for t in tools}
              check(len(tools) >= TOOL_FLOOR, f"tools/list count >= floor {TOOL_FLOOR}", f"count={len(tools)}")
              check(len(tools) == health_tools, "tools/list count == health tool count",
                    f"list={len(tools)} health={health_tools!r}")
              for want in ("get_state", "set_frame", "get_editor_status", "add_frame"):
                  check(want in names, f"tools/list contains {want}")

              # 4-6. Read, mutate, re-read: add_frame must move
              #    the LIVE project's frame count by exactly one,
              #    and a fresh read must see it.
              is_err, before, before_text = call_tool(3, "get_state")
              check(not is_err and before is not None, "get_state answers", before_text[:200])
              frames_before = (before or {}).get("frame_count")
              check(isinstance(frames_before, int) and frames_before >= 1,
                    "get_state frame_count is a positive int", repr(frames_before))
              is_err, added, added_text = call_tool(4, "add_frame")
              check(not is_err and (added or {}).get("ok") is True, "add_frame reports ok", added_text[:200])
              check((added or {}).get("frames") == (frames_before or 0) + 1,
                    "add_frame reply counts the new frame", str(added)[:200])
              is_err, after, after_text = call_tool(5, "get_state")
              check(not is_err and (after or {}).get("frame_count") == (frames_before or 0) + 1,
                    "mutation visible in a fresh get_state", after_text[:200])

              # 7. The edit landed on the live SESSION, not on a
              #    side core: the session's undo history records
              #    it, and its playhead is where the add_frame
              #    reply left it.
              is_err, sess, sess_text = call_tool(6, "get_editor_status")
              check(not is_err and sess is not None, "get_editor_status answers", sess_text[:200])
              sp = sess or {}
              check(sp.get("can_undo") is True and (sp.get("undo_depth") or 0) >= 1,
                    "live session undo history records the edit", str(sp)[:200])
              check(sp.get("current_frame") == (added or {}).get("current_frame"),
                    "live playhead matches the add_frame reply", str(sp)[:200])

              # 8. Wave 14: SHELL control over the live endpoint.
              #    A shell_* call is intercepted by the drain's
              #    peek and executed against the running GUI's
              #    State (never the router's own core): read the
              #    shell state, switch the workspace, read it
              #    back changed, then switch back so the app is
              #    left as the probe found it.
              is_err, shell0, shell0_text = call_tool(7, "shell_get_state")
              check(not is_err and shell0 is not None, "shell_get_state answers over live HTTP", shell0_text[:200])
              ws_before = (shell0 or {}).get("workspace")
              check(ws_before == "Animate", "shell state names the default workspace", repr(ws_before))
              is_err, switched, switched_text = call_tool(8, "shell_set_workspace", {"workspace": "Draw"})
              check(not is_err, "shell_set_workspace executes on the live shell", switched_text[:200])
              is_err, shell1, shell1_text = call_tool(9, "shell_get_state")
              check(not is_err and (shell1 or {}).get("workspace") == "Draw",
                    "the workspace switch is visible in a fresh shell read", shell1_text[:200])
              is_err, back, back_text = call_tool(10, "shell_set_workspace", {"workspace": "Animate"})
              check(not is_err and (back or {}).get("workspace") == "Animate",
                    "workspace switched back to Animate", back_text[:200])
              # A shell selection + transport pair, for breadth:
              # the playhead moves and the transport reads live.
              is_err, sel, sel_text = call_tool(11, "shell_select_frame", {"frame": 0})
              check(not is_err, "shell_select_frame executes on the live shell", sel_text[:200])
              is_err, tr, tr_text = call_tool(12, "shell_get_transport")
              check(not is_err and tr is not None, "shell_get_transport answers", tr_text[:200])

              # 9. Focused Wave: shell_set_timeline is a REAL
              #    control now (its prefs wire is wired — the
              #    Wave 14 exclusion is lifted). Collapse the
              #    timeline on the live shell, read the layout
              #    back (collapsed AND wired), then expand it
              #    again so the app is left as the probe
              #    found it.
              is_err, tl, tl_text = call_tool(13, "shell_set_timeline", {"collapsed": True})
              check(not is_err and (tl or {}).get("collapsed") is True,
                    "shell_set_timeline collapses the timeline on the live shell", tl_text[:200])
              is_err, lay, lay_text = call_tool(14, "shell_get_layout")
              check(not is_err and (lay or {}).get("timeline_collapsed") is True
                    and (lay or {}).get("timeline_collapse_wired") is True,
                    "shell_get_layout shows the timeline collapsed and wired", lay_text[:200])
              is_err, tl2, tl2_text = call_tool(15, "shell_set_timeline", {"collapsed": False})
              check(not is_err and (tl2 or {}).get("collapsed") is False,
                    "shell_set_timeline expands the timeline back", tl2_text[:200])

              # 10. Roadmap Wave 2 (W2-79, IA-W2-79-2): the
              #     subtitle speaker round-trip. Plant two
              #     credited cues via MCP; the SRT export
              #     must report both credits dropped (SRT
              #     has no speaker syntax), and the VTT
              #     export must carry <v NAME> spans with no
              #     speakers_dropped field at all.
              is_err, ad1, ad1_text = call_tool(16, "subtitle_add",
                  {"start_frame": 0, "end_frame": 2, "text": "The bell rings.", "speaker": "NOVA"})
              check(not is_err, "subtitle_add plants a credited cue", ad1_text[:200])
              is_err, ad2, ad2_text = call_tool(17, "subtitle_add",
                  {"start_frame": 2, "end_frame": 4, "text": "We run for the shore.", "speaker": "MARA"})
              check(not is_err, "subtitle_add plants a second credited cue", ad2_text[:200])
              is_err, srt, srt_text = call_tool(18, "subtitle_export_srt",
                  {"path": "headless-out/probe-subtitles.srt"})
              check(not is_err and (srt or {}).get("speakers_dropped") == 2,
                    "SRT export reports both planted credits dropped", srt_text[:200])
              is_err, vtt, vtt_text = call_tool(19, "subtitle_export_vtt",
                  {"path": "headless-out/probe-subtitles.vtt"})
              check(not is_err and vtt is not None and "speakers_dropped" not in (vtt or {}),
                    "VTT export carries no speakers_dropped field", vtt_text[:200])
              try:
                  with open("headless-out/probe-subtitles.vtt") as fh:
                      vtt_doc = fh.read()
                  check("<v NOVA>" in vtt_doc and "<v MARA>" in vtt_doc,
                        "VTT file carries the <v NAME> voice spans")
              except OSError as e:
                  check(False, "VTT file is readable after export", repr(e))

          try:
              main()
          except Exception as e:
              check(False, "probe ran to completion without an exception", repr(e))
          finish()
          PYEOF
          rc=$?
          echo $rc > headless-out/mcp-probe.exit
          if [ $rc -ne 0 ]; then
            echo "Live MCP probe FAILED (exit $rc) — transcript is in headless-out/mcp-probe.txt; app log tail:"
            tail -n 50 headless-out/mcp-live-app.log
          fi
          exit $rc

      # Roadmap F-7 (A26 R1): the overflow scan runs HERE, over
      # the dumps this same run just produced — not in a later
      # human debrief. (Wave X was reported CLEAN while its
      # artifact held 40 hits, because the scan simply never
      # ran.) Fail-soft at step level like every probe step, so
      # the upload below always happens; the strict reading of
      # this output belongs to the verdict job, via the
      # aggregator step next. The scan's own transcript and
      # exit code ride the artifact.
      - name: Overflow scan — over the just-produced dumps
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set +e
          python3 scripts/overflow_scan.py --dir headless-out \
            > headless-out/overflow-scan.txt 2>&1
          echo $? > headless-out/overflow-scan.exit
          cat headless-out/overflow-scan.txt

      # Roadmap Wave 2 (W2-71, IA-W2-71-2): the snapshot-diff
      # debrief — a reviewed-baseline comparison of this run's
      # dumps against the previous closing artifact's dumps.
      # Fail-soft like the overflow scan: exit 1 from this step
      # is a REPORT, not a gate failure (PL-12 posture — the
      # baseline discipline runs report-only until it has a few
      # closes behind it). The baseline directory is the
      # preserved closing artifact under the integrator's
      # .ci-watch store; when no baseline is preserved yet the
      # step says so and does nothing.
      - name: Snapshot diff — debrief against the closing baseline
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set +e
          BASE="$HOME/.ci-watch/closing-baseline"
          if [ -d "$BASE" ]; then
            python3 scripts/snapshot_diff.py --brief "$BASE" headless-out \
              > headless-out/snapshot-diff.txt 2>&1
            echo $? > headless-out/snapshot-diff.exit
            cat headless-out/snapshot-diff.txt
          else
            echo "no closing baseline preserved yet — snapshot diff skipped" \
              | tee headless-out/snapshot-diff.txt
          fi

      # Roadmap F-7 (A26 R1): fold every fail-soft transcript
      # (subtitle census, Home thumbnail probe, both Home
      # markers, live MCP probe) plus the overflow scan into
      # ONE machine-readable verdict: headless-out/verdict.json.
      # Fail-soft like its inputs so the artifact — verdict.json
      # included — always uploads. The `verdict` job below
      # re-runs this same aggregator over the downloaded
      # artifact WITHOUT the fail-soft wrapper; its conclusion
      # is the verdict.
      # Roadmap Wave 2 (W2-66, IA-W2-66-4, minimal tier):
      # the focus census over this run's dumps — fail-soft;
      # the transcript rides the artifact and a red census
      # is visible in the debrief but does not bind (the
      # D-2 tripwire's binding tier is a later ruling).
      - name: Focus census — the D-2 tripwire, report-only
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set +e
          python3 scripts/focus_census.py --self-test
          python3 scripts/focus_census.py headless-out --check \
            --expect scripts/focus_expectations.json \
            > headless-out/focus-census.txt 2>&1
          echo $? > headless-out/focus-census.exit
          cat headless-out/focus-census.txt

      - name: Verdict aggregate — one machine-readable verdict
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set +e
          python3 scripts/verdict_aggregate.py headless-out
          echo $? > headless-out/verdict.exit

      # Whatever exists is the result — including "nothing exists".
      # if-no-files-found: ignore is load-bearing: an absent output
      # is probe data, not a workflow failure.
      - name: Upload probe output (whatever exists)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: headless-probe-output
          path: headless-out/
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary — which artifacts exist
        if: ${{ always() }}
        run: |
          {
            echo "## Headless probe results"
            echo ""
            echo "| Output | Status | Bytes |"
            echo "|---|---|---|"
            for f in headless-out/tree-default.json headless-out/tree-frame-3.json headless-out/tree-selected.json headless-out/tree-playing.json headless-out/snap-default.png headless-out/snap-stage.png headless-out/vulkaninfo.txt headless-out/rect-probe.txt headless-out/snap-subtitles-populated.png headless-out/snap-subtitles-speaker.png headless-out/tree-home-missing-audio.json headless-out/tree-home-scan-fallback.json headless-out/subtitle-census.txt; do
              if [ -f "$f" ]; then
                echo "| $f | PRESENT | $(stat -c%s "$f") |"
              else
                echo "| $f | MISSING | - |"
              fi
            done
            echo ""
            echo "Per-invocation exit codes and logs (.exit / .log, incl. -xvfb variants) are in the 'headless-probe-output' artifact."
            echo "Interpretation guide: see the header comment in .github/workflows/headless.yml."
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la headless-out || true

  # Roadmap F-7 (A26 R1): THE BINDING CHECK. Everything above is
  # fail-soft data collection by design; this job is not. It
  # downloads the probe artifact and re-runs the verdict
  # aggregator over it with no continue-on-error and no `|| true`:
  # the job's conclusion IS the machine-readable verdict. A
  # missing artifact (the probe build died), a FAIL or UNPROVEN
  # transcript, a missing transcript, or a non-CLEAN overflow
  # scan each turn this job — and therefore the run — red.
  # `if: always()` is load-bearing: the job must still render
  # its verdict when the probe job failed, because "no evidence"
  # is a FAIL here, never a skip. To bind the branch, mark the
  # "Binding verdict" check required in branch protection —
  # repository settings are the one part of F-7 a workflow file
  # cannot do itself.
  verdict:
    name: Binding verdict
    needs: headless-probe
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download the probe artifact
        uses: actions/download-artifact@v4
        with:
          name: headless-probe-output
          path: headless-out

      - name: Aggregate the verdict (non-fail-soft)
        run: python3 scripts/verdict_aggregate.py headless-out
