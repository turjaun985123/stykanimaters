name: Build, Test & Binary

# Builds the project, runs the full test suite and publishes ready-to-run
# Linux binaries as a downloadable artifact. Optimised for speed: the Cargo
# cache is reused across runs, and the tests run in the release profile so
# they reuse the build step's artifacts instead of recompiling the world a
# second time in the debug profile.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch/PR cancels the stale run — no wasted minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation makes CI caches big and mostly unreusable.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  build-test-package:
    name: Build, test, package (Linux x86-64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install system libraries (GPUI windowing/audio + ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            libasound2-dev \
            libudev-dev \
            cmake \
            clang \
            ffmpeg

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # The main speed-up: caches the Cargo registry, git dependencies and
      # the target directory, keyed by Cargo.lock. Unchanged crates are
      # never recompiled on later runs.
      - name: Cache Cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-release
          cache-on-failure: true

      - name: Build (release, all binaries)
        run: cargo build --release --locked --bins

      # Release profile on purpose: the test run reuses the exact artifacts
      # compiled above. (A debug-profile test run would recompile every
      # dependency from scratch.)
      - name: Test (release profile — reuses build artifacts)
        run: cargo test --release --locked

      - name: Prepare the binary package
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          cp target/release/stykanimate-rs dist/
          cp target/release/mcp_server dist/
          strip dist/stykanimate-rs dist/mcp_server
          (cd dist && sha256sum stykanimate-rs mcp_server > SHA256SUMS.txt)
          ls -lh dist

      - name: Upload the binaries as an artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: stykanimaters-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 90

  # Roadmap F-7 (A26 R1): the source gate and the instruments'
  # self-tests run IN CI as their own job — pure stdlib Python,
  # no Rust toolchain, about a minute. Until this job existed
  # the gate was a human ritual: it ran locally when someone
  # remembered, and a wave could close on a gate nobody had
  # re-run. A failed check here fails the run's conclusion
  # exactly like a failed test. Independent of the build job
  # on purpose (parallel, fast feedback); binding comes from
  # the run conclusion, not from job ordering.
  #
  # The key-diff check compares the tree against the change's
  # BASE — push: the before-commit; PR: the base sha — never
  # plain HEAD: on a committed checkout, diffing against HEAD
  # would find no changed files and pass vacuously.
  gate:
    name: Source gate + instrument self-tests (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Full history: the gate diffs against the base ref.
          fetch-depth: 0

      - name: Source gate (phase_j_checks.py)
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          fi
          if [ -z "$BASE" ]; then BASE="HEAD"; fi
          echo "gate key-diff base: $BASE"
          python3 scripts/phase_j_checks.py "$BASE"

      # Roadmap F-10 (RM11, IA-RM11-1): the schema half of
      # the standing parity audit — check 11 inside the
      # gate covers counts; this compares every tool's
      # argument schema against docs/MCP.md.
      - name: MCP schema audit (mcp_schema_audit.py)
        run: python3 scripts/mcp_schema_audit.py

      # Each instrument proves it is not vacuous against
      # synthetic fixtures (a probe that cannot fail proves
      # nothing). The verdict aggregator's self-test joins
      # them: it pins that FAIL / UNPROVEN / missing evidence
      # all fold to a FAIL verdict.
      - name: Instrument self-tests (scan, census, thumbnail probe, aggregator)
        run: |
          python3 scripts/overflow_scan.py --self-test
          python3 scripts/subtitle_census.py --self-test
          python3 scripts/home_thumbnail_probe.py --self-test
          python3 scripts/verdict_aggregate.py --self-test
          python3 scripts/snapshot_diff.py --self-test
          python3 scripts/perf_budget.py --self-test
